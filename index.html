<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>极光加速 | GitHub 文件代理服务</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans', sans-serif;
            background: linear-gradient(145deg, #f6f9fc 0%, #edf2f7 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            position: relative;
        }

        /* 装饰光晕 */
        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle at 30% 40%, rgba(64, 158, 255, 0.08) 0%, rgba(64, 158, 255, 0) 60%);
            pointer-events: none;
            z-index: 0;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
        }

        .container {
            max-width: 820px;
            width: 100%;
            z-index: 2;
            position: relative;
            animation: fadeInUp 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* header 区域 */
        .hero {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .badge {
            display: inline-block;
            background: rgba(64, 158, 255, 0.12);
            backdrop-filter: blur(4px);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1e6fdf;
            margin-bottom: 1.2rem;
            letter-spacing: 0.3px;
            border: 0.5px solid rgba(64, 158, 255, 0.25);
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1F2A3E 0%, #2c3e50 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.01em;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #4a5b6e;
            font-weight: 450;
            margin-top: 0.4rem;
            border-bottom: none;
        }

        /* 主卡片 */
        .form-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(0px);
            border-radius: 1.75rem;
            padding: 2rem 2rem 2.2rem;
            margin-bottom: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .form-card:hover {
            box-shadow: 0 24px 42px -16px rgba(0, 0, 0, 0.12);
        }

        .input-group {
            margin-bottom: 2rem;
            position: relative;
        }

        .url-label {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #5b6e8c;
            margin-bottom: 0.6rem;
            display: block;
        }

        .modern-input {
            width: 100%;
            border: 1.5px solid #e2e8f0;
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            font-size: 0.95rem;
            font-family: 'SF Mono', 'Fira Code', 'Monaco', monospace;
            background: #ffffff;
            transition: all 0.25s ease;
            color: #1e293b;
            outline: none;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .modern-input:focus {
            border-color: #409EFF;
            box-shadow: 0 4px 12px rgba(64, 158, 255, 0.12);
            outline: none;
        }

        .modern-input::placeholder {
            color: #b9c3d4;
            font-family: system-ui, monospace;
            font-size: 0.9rem;
        }

        .hint-text {
            font-size: 0.75rem;
            margin-top: 0.6rem;
            margin-left: 0.75rem;
            color: #7c8ba0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hint-text svg {
            opacity: 0.7;
        }

        .submit-btn {
            background: linear-gradient(105deg, #1e6fdf 0%, #409EFF 100%);
            border: none;
            width: 100%;
            padding: 1rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 8px 20px -8px rgba(64, 158, 255, 0.4);
            border: 0.5px solid rgba(255,255,255,0.2);
        }

        .submit-btn:hover {
            background: linear-gradient(105deg, #0f5bc5 0%, #2c8ef8 100%);
            transform: translateY(-1px);
            box-shadow: 0 14px 24px -10px rgba(64, 158, 255, 0.5);
        }

        .submit-btn:active {
            transform: translateY(1px);
        }

        /* 信息卡片 */
        .info-section {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(2px);
            border-radius: 1.75rem;
            padding: 1.75rem 2rem;
            margin-bottom: 1.8rem;
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 6px 14px -6px rgba(0, 0, 0, 0.05);
        }

        .tips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            margin-bottom: 1.6rem;
        }

        .tip-pill {
            background: #f1f5f9;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            color: #2c3e50;
            font-weight: 480;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .tip-pill::before {
            content: "⚡";
            font-size: 0.9rem;
            filter: drop-shadow(0 1px 1px rgba(0,0,0,0.1));
        }

        .example-title {
            font-weight: 600;
            color: #1f2a3e;
            margin-bottom: 1rem;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 3px solid #409EFF;
            padding-left: 0.75rem;
        }

        .example-grid {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .example-item {
            background: #f8fafd;
            border-radius: 1rem;
            padding: 0.8rem 1.2rem;
            font-family: 'SF Mono', 'Monaco', 'Cascadia Code', monospace;
            font-size: 0.85rem;
            color: #1e4663;
            transition: all 0.2s;
            border: 1px solid #edf2f7;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            word-break: break-all;
        }

        .example-item:hover {
            background: #eef3fc;
            border-color: #cde3fe;
            transform: translateX(4px);
        }

        .copy-icon {
            opacity: 0.5;
            font-size: 0.9rem;
            transition: opacity 0.2s;
            background: #e9edf2;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            font-family: system-ui;
        }

        .example-item:hover .copy-icon {
            opacity: 1;
            background: #d4e2f5;
        }

        footer {
            text-align: center;
            font-size: 0.8rem;
            color: #6c7a91;
            padding: 1rem 0 0.2rem;
            border-top: 1px solid rgba(100, 116, 139, 0.15);
            margin-top: 0.5rem;
        }

        footer a {
            color: #2b6ed7;
            text-decoration: none;
            font-weight: 500;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                padding: 1.2rem;
            }
            h1 {
                font-size: 2.2rem;
            }
            .form-card {
                padding: 1.5rem;
            }
            .info-section {
                padding: 1.4rem;
            }
            .example-item {
                font-size: 0.75rem;
                padding: 0.6rem 1rem;
            }
        }

        /* 动画反馈 */
        .toast-message {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) scale(0.95);
            background: #1f2a3ecc;
            backdrop-filter: blur(12px);
            color: white;
            padding: 0.6rem 1.6rem;
            border-radius: 3rem;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 8px 18px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <div class="badge">
                🚀 极速代理 · 全球加速
            </div>
            <h1>GitHub 文件加速</h1>
            <p class="subtitle">基于 gyj07/proxy 打造 | 秒级响应，智能路由</p>
        </div>

        <div class="form-card glass-card">
            <form id="accelerateForm">
                <div class="input-group">
                    <label class="url-label" for="fileUrl">📎 资源链接</label>
                    <input class="modern-input" id="fileUrl" name="q" type="text" 
                           placeholder="例如：https://github.com/user/repo/archive/main.zip"
                           pattern="^((https|http):\/\/)?(github\.com\/.+?\/.+?\/(?:releases|archive|blob|raw|suites)|((?:raw|gist)\.(?:githubusercontent|github)\.com))\/.+$" 
                           autocomplete="off">
                    <div class="hint-text">
                        <span>✨</span> 支持 release、archive、单个文件（blob/raw），无需协议头也可以
                    </div>
                </div>
                <button class="submit-btn" type="submit">
                    <span>⚡ 立即加速</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </div>

        <div class="info-section">
            <div class="tips">
                <span class="tip-pill">Release / Archive 走 Cloudflare 边缘节点</span>
                <span class="tip-pill">文件资源跳转 JsDelivr CDN</span>
                <span class="tip-pill">不支持文件夹，支持单文件极速取回</span>
            </div>

            <div class="example-title">
                📋 点击示例，即刻填充
            </div>
            <div class="example-grid" id="exampleList">
                <!-- 示例列表通过js动态可读，但保留静态更加语义 -->
            </div>
        </div>

        <footer>
            <p>⚡ 开源加速服务 · 由 <a href="https://github.com/gyj07/proxy" target="_blank" rel="noopener">gyj07/proxy</a> 强力驱动 | 提升 GitHub 资源访问体验</p>
        </footer>
    </div>

    <!-- 轻提示浮层 -->
    <div id="toastMsg" class="toast-message"></div>

    <script>
        // 优雅的示例列表 (强化展示更多真实例子)
        const examples = [
            "https://github.com/gyj07/proxy/archive/master.zip",
            "https://github.com/gyj07/proxy/archive/v1.0.0.tar.gz",
            "https://github.com/gyj07/proxy/releases/download/v0.1.0/example.zip",
            "https://github.com/gyj07/proxy/blob/main/README.md",
            "https://raw.githubusercontent.com/gyj07/proxy/main/index.js"
        ];

        // 更友好的描述性标签（可选显示简短说明）
        const exampleHints = [
            "📦 项目 Archive (ZIP)",
            "🗜️ 压缩包 tar.gz",
            "🏷️ Release 附件",
            "📄 仓库内文件 (blob)",
            "📁 原始 raw 文件"
        ];

        const exampleContainer = document.getElementById('exampleList');
        if (exampleContainer) {
            examples.forEach((url, idx) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'example-item';
                // 左侧链接 + 右侧小提示
                const linkSpan = document.createElement('span');
                linkSpan.textContent = url;
                linkSpan.style.flex = '1';
                linkSpan.style.fontFamily = 'monospace';
                linkSpan.style.fontSize = '0.82rem';
                linkSpan.style.wordBreak = 'break-all';

                const hintSpan = document.createElement('span');
                hintSpan.textContent = exampleHints[idx] || '点击填充';
                hintSpan.className = 'copy-icon';
                hintSpan.style.marginLeft = '12px';
                hintSpan.style.fontSize = '0.7rem';
                hintSpan.style.fontWeight = '500';

                itemDiv.appendChild(linkSpan);
                itemDiv.appendChild(hintSpan);
                
                // 点击填充
                itemDiv.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const urlInput = document.getElementById('fileUrl');
                    if (urlInput) {
                        urlInput.value = url;
                        urlInput.focus();
                        // 添加微妙的成功反馈
                        showToast(`✔ 已填入示例：${url.length > 50 ? url.slice(0, 50) + '…' : url}`, 1500);
                        // 轻颤动画
                        urlInput.style.transform = 'scale(1.01)';
                        setTimeout(() => { if(urlInput) urlInput.style.transform = ''; }, 180);
                    }
                });
                exampleContainer.appendChild(itemDiv);
            });
        }

        // 通用的 toSubmit 功能，使用当前服务地址作为代理前缀
        function generateProxyUrl(originalUrl) {
            // 获取当前页面基础路径 (类似 https://xxx.com/ 或者当前目录)
            let currentOrigin = window.location.href;
            // 去除 hash 和 query 参数
            const baseUrl = currentOrigin.split('?')[0].split('#')[0];
            // 确保以 '/' 结尾
            const lastSlashIndex = baseUrl.lastIndexOf('/');
            let proxyBase = baseUrl.substring(0, lastSlashIndex + 1);
            // 如果是根路径类似 http://domain/ 就保留
            if (!proxyBase.endsWith('/')) proxyBase += '/';
            // 拼接: 直接使用标准格式: 当前服务地址 + 原始链接 (支持协议头或省略)
            let cleanUrl = originalUrl.trim();
            // 如果用户输入没有协议头，但包含 github.com 等，手动补全 https:// 保证解析
            if (!/^(https?:\/\/)/i.test(cleanUrl) && cleanUrl.includes('github.com')) {
                cleanUrl = 'https://' + cleanUrl;
            }
            // 最终代理跳转地址: 根据 proxy 规范，原样拼接
            return proxyBase + cleanUrl;
        }

        function showToast(message, duration = 2000) {
            const toast = document.getElementById('toastMsg');
            if (!toast) return;
            toast.textContent = message;
            toast.style.opacity = '1';
            toast.style.transform = 'translateX(-50%) scale(1)';
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) scale(0.95)';
            }, duration);
        }

        function validateUrl(url) {
            if (!url || url.trim() === '') {
                showToast('❓ 请输入 GitHub 文件链接', 1800);
                return false;
            }
            let checkUrl = url.trim();
            if (!/^(https?:\/\/)/i.test(checkUrl)) {
                checkUrl = 'https://' + checkUrl;
            }
            // 加强正则，但主要判断 github.com 相关域
            const githubPattern = /^(https?:\/\/)?(github\.com\/.+?\/.+?\/(releases|archive|blob|raw|suites)|((raw|gist)\.(githubusercontent|github)\.com)).+/i;
            if (!githubPattern.test(checkUrl) && !checkUrl.includes('github.com') && !checkUrl.includes('githubusercontent.com')) {
                showToast('⚠️ 仅支持 GitHub 相关链接（release, archive, raw, blob 等）', 2000);
                return false;
            }
            // 额外防止文件夹: 简单判断路径最后部分不要为空且不是树目录
            if (checkUrl.includes('/tree/') || (checkUrl.includes('github.com') && checkUrl.split('/').length > 5 && checkUrl.includes('/tree/'))) {
                showToast('📁 暂不支持项目文件夹 (tree)，请指向具体文件或压缩包', 2200);
                return false;
            }
            return true;
        }

        // 提交处理 (阻止默认行为)
        const form = document.getElementById('accelerateForm');
        if (form) {
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const urlInput = document.getElementById('fileUrl');
                let rawValue = urlInput.value;
                if (!rawValue) {
                    showToast('✨ 请在输入框粘贴 GitHub 链接', 1600);
                    urlInput.focus();
                    return;
                }
                if (!validateUrl(rawValue)) {
                    return;
                }
                // 处理前缀空格
                let finalUrl = rawValue.trim();
                if (!/^(https?:\/\/)/i.test(finalUrl)) {
                    finalUrl = 'https://' + finalUrl;
                }
                // 生成代理链接并打开新窗口
                const proxyFullLink = generateProxyUrl(finalUrl);
                
                // 新窗口打开加速地址
                window.open(proxyFullLink, '_blank', 'noopener,noreferrer');
                showToast('🚀 加速链接已打开，享受极速下载', 1800);
                // 可选: 增加输入框轻闪反馈
                urlInput.style.transition = '0.15s';
                urlInput.style.boxShadow = '0 0 0 2px rgba(64,158,255,0.3)';
                setTimeout(() => {
                    if (urlInput) urlInput.style.boxShadow = '';
                }, 400);
            });
        }

        // 检查页面加载时若有 url 参数自动填充 (增强体验：支持直接 ?url=xxx)
        const urlParams = new URLSearchParams(window.location.search);
        const prefillUrl = urlParams.get('url') || urlParams.get('q');
        if (prefillUrl && document.getElementById('fileUrl')) {
            const inputEl = document.getElementById('fileUrl');
            let decoded = decodeURIComponent(prefillUrl);
            inputEl.value = decoded;
            // 可选自动聚焦
            setTimeout(() => {
                if (inputEl) inputEl.focus();
            }, 100);
        }

        // 增加额外键盘监听: cmd/ctrl + enter 快速提交
        const urlField = document.getElementById('fileUrl');
        if (urlField) {
            urlField.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    form.dispatchEvent(new Event('submit'));
                }
            });
        }

        // 优雅动态背景/微交互动画
        const heroBadge = document.querySelector('.badge');
        if (heroBadge) {
            heroBadge.addEventListener('mouseenter', () => {
                heroBadge.style.transform = 'scale(1.02)';
                heroBadge.style.transition = '0.2s';
            });
            heroBadge.addEventListener('mouseleave', () => {
                heroBadge.style.transform = 'scale(1)';
            });
        }

        // 如果示例列表二次确保样式兼容 (添加hover透明效果)
        const style = document.createElement('style');
        style.textContent = `
            .example-item {
                transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            }
            .modern-input:focus {
                border-color: #409EFF;
                background-color: #fefefe;
            }
            .submit-btn:active svg {
                transform: translateX(2px);
                transition: transform 0.1s;
            }
        `;
        document.head.appendChild(style);
        
        // 加入稍微更智能的：如果用户粘贴raw或者blob链接后呈现优化提示
        urlField?.addEventListener('input', (e) => {
            const val = e.target.value;
            if (val.includes('blob/') && !val.includes('raw')) {
                // 温和提醒但不用打扰，只是美观提示下 (可选)
                const hintDiv = document.querySelector('.hint-text');
                if (hintDiv && !hintDiv.innerHTML.includes('blob提示')) {
                    // 短暂显示一个气泡提示可以通过? 不做侵入，改内容太繁琐，就简单加个data属性但无所谓，不加干扰
                }
            }
        });

        // 增加额外的复制示例功能 (可选，为了更好的体验)
        const examplesItems = document.querySelectorAll('.example-item');
        examplesItems.forEach(item => {
            // 如果用户右键或者想复制链接，但默认点击就是填充，我们额外添加双击复制功能（可选优化）
            item.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                const linkText = item.querySelector('span:first-child')?.innerText || '';
                if (linkText && navigator.clipboard) {
                    navigator.clipboard.writeText(linkText).then(() => {
                        showToast('📋 链接已复制，可粘贴至输入框', 1200);
                    }).catch(() => {
                        showToast('⚠️ 手动复制吧', 1000);
                    });
                }
            });
            // 增加工具提示
            item.title = '单击填充 · 双击复制链接';
        });

        // 老版pattern提示交互
        const formCard = document.querySelector('.form-card');
        if (formCard) {
            formCard.addEventListener('mouseenter', () => {
                formCard.style.transform = 'translateY(-2px)';
            });
            formCard.addEventListener('mouseleave', () => {
                formCard.style.transform = 'translateY(0px)';
            });
        }
    </script>
</body>
</html>
